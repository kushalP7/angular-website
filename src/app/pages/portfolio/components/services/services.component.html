<section id="services" class="services bg-body">
  <div class="container">
    
    <!-- Section Header -->
    <div class="row text-center mb-5" appScrollReveal revealClass="reveal-active">
      <div class="col-lg-8 mx-auto">
        <span class="subtitle">Offerings</span>
        <h2 class="section-title">What I Do Best</h2>
        <p class="text-secondary">
          High-quality solutions built on performance, accessibility, and robust architectural principles.
        </p>
      </div>
    </div>

    <!-- Services Grid -->
    <div class="row g-4">
      @for (service of portfolio.servicesList; track service.title) {
        <div class="col-md-6 col-lg-4 d-flex" appScrollReveal revealClass="reveal-active" [delay]="$index * 100">
          <div class="service-card d-flex flex-column p-4 rounded-4 border border-color bg-surface w-100 position-relative overflow-hidden">
            <!-- Glowing Accent Border -->
            <div class="card-glow-accent"></div>

            <!-- Service Icon -->
            <div class="service-icon-box d-flex align-items-center justify-content-center mb-4">
              <i [class]="service.icon"></i>
            </div>

            <!-- Title & Description -->
            <h3 class="h5 font-headings mb-3 service-title">{{ service.title }}</h3>
            <p class="text-secondary small mb-0 flex-grow-1 line-height-1-6">
              {{ service.description }}
            </p>
          </div>
        </div>
      }
    </div>

  </div>
</section>
