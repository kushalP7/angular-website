<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)" rx="16" />
  
  <!-- Dashboard Grid -->
  <rect x="40" y="40" width="720" height="420" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Top Bar -->
  <path d="M 40,80 L 760,80" stroke="#334155" stroke-width="2" />
  <circle cx="65" cy="60" r="6" fill="#ef4444" />
  <circle cx="85" cy="60" r="6" fill="#eab308" />
  <circle cx="105" cy="60" r="6" fill="#22c55e" />
  <rect x="140" y="52" width="180" height="16" rx="4" fill="#475569" />
  
  <!-- Sidebar -->
  <path d="M 180,80 L 180,460" stroke="#334155" stroke-width="2" />
  <rect x="55" y="110" width="110" height="12" rx="4" fill="url(#accent)" />
  <rect x="55" y="140" width="110" height="12" rx="4" fill="#475569" />
  <rect x="55" y="170" width="110" height="12" rx="4" fill="#475569" />
  <rect x="55" y="200" width="110" height="12" rx="4" fill="#475569" />
  
  <!-- Content cards -->
  <rect x="205" y="105" width="250" height="140" rx="8" fill="#0f172a" stroke="#475569" />
  <rect x="480" y="105" width="250" height="140" rx="8" fill="#0f172a" stroke="#475569" />
  <rect x="205" y="265" width="525" height="170" rx="8" fill="#0f172a" stroke="#475569" />
  
  <!-- Line chart in bottom card -->
  <path d="M 230,400 L 300,340 L 370,370 L 440,300 L 510,350 L 580,290 L 650,330 L 700,285" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Bars in top cards -->
  <rect x="225" y="180" width="40" height="50" rx="4" fill="#6366f1" />
  <rect x="275" y="150" width="40" height="80" rx="4" fill="#a855f7" />
  <rect x="325" y="130" width="40" height="100" rx="4" fill="#ec4899" />
  
  <text x="400" y="250" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="24" font-weight="bold" text-anchor="middle">ZENITH DASHBOARD</text>
  <text x="400" y="280" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">REPLACE WITH PROJECT SCREENSHOT</text>
</svg>
