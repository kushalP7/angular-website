<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="g5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#g5)" rx="16" />
  
  <!-- Brain/Imaging silhouette or grids -->
  <circle cx="400" cy="180" r="90" fill="#022c22" stroke="url(#accent5)" stroke-width="3" stroke-dasharray="10,5" />
  
  <!-- Concentric scans -->
  <circle cx="400" cy="180" r="70" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
  <circle cx="400" cy="180" r="50" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4" />
  
  <!-- Crosshairs -->
  <line x1="280" y1="180" x2="520" y2="180" stroke="#059669" stroke-width="2" opacity="0.7" />
  <line x1="400" y1="60" x2="400" y2="300" stroke="#059669" stroke-width="2" opacity="0.7" />
  
  <!-- "Abnormality" highlighted area -->
  <circle cx="430" cy="150" r="20" fill="#ef4444" opacity="0.4" />
  <circle cx="430" cy="150" r="5" fill="#ef4444" />
  
  <text x="400" y="380" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">NEUROPATH ANALYZER</text>
  <text x="400" y="410" fill="#10b981" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">AI-ASSISTED MRI SEGMETATION &amp; DICOM PORTAL</text>
  <text x="400" y="440" fill="#6ee7b7" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">REPLACE WITH MEDICAL IMAGING OR INTERFACE SCREENSHOT</text>
