<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="kpFaviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="kpFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer smooth container -->
  <rect width="100%" height="100%" fill="#0b0f19" rx="140" />
  
  <!-- Glowing subtle inner boundary -->
  <rect x="20" y="20" width="472" height="472" fill="none" stroke="url(#kpFaviconGrad)" stroke-width="14" rx="120" opacity="0.85" filter="url(#kpFaviconGlow)" />
  
  <!-- Stylized KP Monogram -->
  <g transform="translate(0, 5)">
    <!-- Combined K and P glyph with premium typography styling -->
    <text x="50%" y="60%" fill="url(#kpFaviconGrad)" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="230" font-weight="900" text-anchor="middle" letter-spacing="-8">KP</text>
  </g>
  
  <!-- Code/Tech dot decoration -->
  <circle cx="395" cy="305" r="22" fill="#ec4899" filter="url(#kpFaviconGlow)" />
</svg>
